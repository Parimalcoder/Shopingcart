<div style="max-width: 1100px; margin: auto; padding: 20px;">
  <h2>પ્રોડક્ટ્સ સ્ટોર</h2>

  <!-- Signals માટે isLoading() કૌંસ સાથે -->
  @if (isLoading()) {
    <p style="font-size: 18px; color: #555;">પ્રોડક્ટ્સ લોડ થઈ રહી છે...</p>
  } @else {
    <!-- Signals માટે products() કૌંસ સાથે -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px;">
      @for (product of products(); track product.id) {
        <div style="border: 1px solid #ddd; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; background: #fff;">
          <div>
            <img [src]="product.image" [alt]="product.title" style="width: 100%; height: 180px; object-fit: contain; margin-bottom: 10px;">
            <h4 style="font-size: 14px; margin: 5px 0; height: 38px; overflow: hidden;">{{ product.title }}</h4>
            <p style="color: #2e7d32; font-size: 18px; font-weight: bold; margin: 10px 0;">
              {{ product.price | currency:'USD' }}
            </p>
          </div>
          <button (click)="addToCart(product)" style="background-color: #ff9900; color: white; border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%;">
            Add to Cart 🛒
          </button>
        </div>
      }
    </div>
  }
</div>
