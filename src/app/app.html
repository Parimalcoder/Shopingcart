<nav style="padding: 15px 25px; background: #232f3e; display: flex; justify-content: space-between; align-items: center;">
  <a routerLink="/" style="color: white; font-size: 20px; font-weight: bold; text-decoration: none;">🛍️ Angular Store</a>
  <div style="display: flex; gap: 20px;">
    <a routerLink="/Home" style="color: white; text-decoration: none;">Home</a>
    <a routerLink="/cart" style="color: white; text-decoration: none;">
      Cart 🛒
      @if (cartCount() > 0) {
        <span style="background: #ff9900; color: black; font-weight: bold; border-radius: 50%; padding: 2px 7px; font-size: 12px;">
          {{ cartCount() }}
        </span>
      }
    </a>
  </div>
</nav>
<main>
  <router-outlet></router-outlet>
</main>
